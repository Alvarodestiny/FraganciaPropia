const C={fresco:"#4FA3C7",citrico:"#E6B422",floral:"#D96C9B",dulce:"#C9783F",amaderado:"#7A5C3E",especiado:"#B5452B",ambar:"#D98B2B"};
const SH=[[[14,44,52,64,10],[20,72,40,30,6]],[[12,52,56,56,28],[19,78,42,24,12]],[[22,36,36,72,6],[27,68,26,34,3]]];
const rc=(a,s)=>`<rect x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}" rx="${a[4]||0}" ${s}/>`;
function bottle(p){
  const im=IMG[p.n+" "+p.b];
  if(im)return `<img class="pic" src="${im}" alt="${p.n}" loading="lazy" style="object-fit:contain">`;
  const [o,l]=SH[[...p.n].reduce((s,c)=>s+c.charCodeAt(0),0)%3],ln="style=\"fill:var(--card);stroke:var(--ink);stroke-width:2\"";
  return `<svg class="pic" viewBox="0 0 80 120" aria-hidden="true">${rc([34,28,12,18],ln)}${rc([29,12,22,18,3],`fill="${C[p.k[1]||p.k[0]]}"`)}${rc(o,ln)}${rc(l,`fill="${C[p.k[0]]}" opacity=".85"`)}</svg>`;
}
let step=0,ans=[];

const FK="fp:fav";
let FAV=[];
try{FAV=JSON.parse(localStorage.getItem(FK)||"[]");if(!Array.isArray(FAV))FAV=[];}catch(e){FAV=[];}
const pk=p=>p.n+"|"+p.b;
const isFav=p=>FAV.includes(pk(p));
function syncFav(){$("#favn").textContent=FAV.length;$("#favbtn").hidden=!FAV.length;}
function toggleFav(k){
  FAV=FAV.includes(k)?FAV.filter(x=>x!==k):[...FAV,k];
  try{localStorage.setItem(FK,JSON.stringify(FAV));}catch(e){}

}

const cardH=(p,why)=>`<article class="card"><button class="fav" data-k="${encodeURIComponent(pk(p))}" aria-pressed="${isFav(p)}" aria-label="Guardar ${esc(p.n)} en favoritos">♥</button>${bottle(p)}<h3>${esc(p.n)}</h3><p class="brand">${esc(p.b)}</p>${why?`<p class="why">${why}</p>`:""}<p class="d">${esc(p.d)}</p><div class="chips">${p.k.slice(0,3).map(k=>`<span>${L[k]}</span>`).join("")}</div><div class="lk">${p.f?`<a href="${p.f}" target="_blank" rel="noopener">Ficha en Fragrantica</a>`:""}${AFF||p.u?`<a href="${buy(p)}" target="_blank" rel="sponsored noopener">Comprar</a>`:""}</div></article>`;

/* ---------- resultados ---------- */
let R=null;
const sc=p=>{const {tag,sea,tim,inten}=R;return p.k.reduce((a,k)=>a+(tag[k]||0)*2,0)+p.s.filter(x=>sea[x]).length*3+p.h.filter(x=>tim[x]).length*3+inten.reduce((a,i)=>a+Math.max(0,4-Math.abs(p.i-i)*3),0);};
function ranked(t){
  const F=R.F;
  return P.filter(p=>p.t===t&&(F.gen==="x"||p.g==="u"||p.g===F.gen)&&(!F.est||p.s.includes(F.est))&&(!F.int||p.i===+F.int)&&(!F.fav||isFav(p)))
    .map((p,i,a)=>[sc(p)+3*(1-i/a.length),p]).sort((a,b)=>b[0]-a[0]);
}
function why(p){
  const {tag,sea,tim,inten}=R,out=[];
  const k=p.k.filter(x=>tag[x]).map(x=>PL[x]);
  if(k.length)out.push("aromas "+k.slice(0,2).join(" y "));
  const s=p.s.filter(x=>sea[x]);if(s.length)out.push("ideal para "+s.join(" y "));
  const h=p.h.filter(x=>tim[x]);if(h.length)out.push("pensado para "+h.map(x=>({"mañana":"la mañana","tarde":"la tarde","noche":"la noche"})[x]).join(" y "));
  if(inten.includes(p.i))out.push("presencia "+["","suave","equilibrada","intensa"][p.i]);
  return out.length?"<b>Te encaja por:</b> "+out.join(", ")+".":"";
}
function paint(){
  $("#tiers").innerHTML=T.map(t=>{
    const l=ranked(t.id),n=R.shown[t.id];
    return `<div class="tier"><h2>${t.name}</h2><p>${t.note}</p>`+
      (l.length?`<div class="grid">${l.slice(0,n).map(([,p])=>cardH(p,why(p))).join("")}</div>`+(l.length>n?`<button class="again more" data-more="${t.id}">Ver 3 más</button>`:"")
        :`<p>Ningún perfume encaja con estos filtros.</p>`)+`</div>`;
  }).join("");
}

function results(){
  const sel=ans.map((a,i)=>Q[i].o[a]);
  const tag={},sea={},tim={},inten=[];let g="x";
  sel.forEach(o=>{
    (o.k||[]).forEach(k=>tag[k]=(tag[k]||0)+1);
    if(o.s)sea[o.s]=1;
    if(o.h)tim[o.h]=1;
    if(o.i)inten.push(o.i);
    if(o.g)g=o.g;
  });
  const top=Object.entries(tag).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>PL[e[0]]);
  R={tag,sea,tim,inten,top,F:{gen:g,est:"",int:"",fav:false},shown:{e:3,d:3,n:3}};
  $("#results").innerHTML=
    `<h2 class="t">Tu selección</h2>`+
    `<p class="lead">Te van los aromas ${top.join(" y ")}. Estos son los perfumes que mejor encajan contigo en cada rango de precio.${AFF?" Los enlaces a Notino son de afiliado: si compras a través de ellos, podemos recibir una comisión sin coste extra para ti.":""}</p>`+
    `<div class="acts"><button class="again" id="share-btn">Compartir mi perfil</button><button class="again" id="again">Repetir el cuestionario</button></div>`+
    `<div class="filters" role="group" aria-label="Filtros">`+
      `<label>Género<select data-f="gen"><option value="x">Todos</option><option value="m">Masculinos</option><option value="f">Femeninos</option></select></label>`+
      `<label>Estación<select data-f="est"><option value="">Cualquiera</option><option value="primavera">Primavera</option><option value="verano">Verano</option><option value="otoño">Otoño</option><option value="invierno">Invierno</option></select></label>`+
      `<label>Intensidad<select data-f="int"><option value="">Cualquiera</option><option value="1">Suave</option><option value="2">Equilibrada</option><option value="3">Intensa</option></select></label>`+
      `<label class="chk"><input type="checkbox" data-f="fav"> Solo mis favoritos</label>`+
    `</div><div id="tiers"></div>`+
    `<p class="foot">Recomendaciones basadas en los votos de la comunidad de Fragrantica (estaciones, momento del día y acordes). Los rangos de precio son orientativos y la disponibilidad depende de cada tienda.</p>`;
  const gs=document.querySelector('[data-f="gen"]');if(gs)gs.value=g;
  paint();
  show("results","#results .t");
}

function favs(){
  const items=FAV.map(k=>P.find(p=>pk(p)===k)).filter(Boolean);

let shareCanvas=null;
async function share(){
  const picks=T.map(t=>[t,(ranked(t.id)[0]||[])[1]]).filter(x=>x[1]);
  try{await document.fonts.load('600 60px Fraunces');}catch(e){}
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d"),F="Fraunces,Georgia,serif",B="Figtree,system-ui,sans-serif";
  const txt=(t,px,xx,yy,col,f=F,w=600,max=880)=>{x.fillStyle=col;while(px>26){x.font=w+" "+px+"px "+f;if(x.measureText(t).width<=max)break;px-=2;}x.fillText(t,xx,yy);};
  const rr=(a,b,w,h,r)=>x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h);
  x.fillStyle="#111111";x.fillRect(0,0,W,H);
  x.fillStyle="rgba(255,255,255,.07)";x.beginPath();x.arc(W-120,160,330,0,7);x.fill();
  x.textAlign="left";
  txt("FRAGANCIA PROPIA",34,100,120,"#BDBDBD",B);
  txt("Mi perfil olfativo",92,100,260,"#FFFFFF");
  txt("Aromas "+R.top.join(" y "),46,100,345,"#FFFFFF",B);
  const ks=o=>Object.keys(o).join(", ")||"cualquiera";
  txt("Estación: "+ks(R.sea),36,100,410,"#A6A6A6",B,500);
  txt("Momento: "+ks(R.tim),36,100,460,"#A6A6A6",B,500);
  picks.forEach(([t,p],i)=>{
    const y=560+i*230;
    x.fillStyle="#1E1E1E";x.beginPath();rr(70,y,940,200,28);x.fill();
    x.fillStyle=C[p.k[1]||p.k[0]];x.fillRect(135,y+34,30,24);
    x.fillStyle="#FFFFFF";x.fillRect(143,y+56,14,16);
    x.fillStyle=C[p.k[0]];x.beginPath();rr(110,y+70,80,86,16);x.fill();
    txt(t.name.toUpperCase(),28,240,y+66,"#BDBDBD",B,600,700);
    txt(p.n,52,240,y+120,"#FFFFFF",F,600,730);
    txt(p.b,34,240,y+166,"#A6A6A6",B,500,730);
  });
  x.textAlign="center";
  txt("Descubre el tuyo en fraganciapropia.es",38,W/2,1290,"#FFFFFF",B,500);
  shareCanvas=c;
  const url=c.toDataURL("image/png");
  $("#share").innerHTML=`<div class="sh" role="dialog" aria-label="Tarjeta para compartir"><img src="${url}" alt="Tarjeta con tu perfil olfativo y tus perfumes recomendados"><div class="acts"><a class="again" href="${url}" download="mi-perfil-fragancia-propia.png">Descargar</a>${navigator.canShare?'<button class="again" id="sh-send">Compartir</button>':""}<button class="again" id="sh-x">Cerrar</button></div><p class="small">Si no se descarga, mantén pulsada la imagen (móvil) o haz clic derecho y «Guardar imagen».</p></div>`;
  $("#share").hidden=false;$("#sh-x").focus();
}

function start(){step=0;ans=[];ask();}

$("#start").addEventListener("click",start);
$("#quiz").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="back"){step--;ask();return;}
  if(b.classList.contains("opt")){
    ans[step]=+b.dataset.i;
    document.querySelectorAll("#quiz .opt").forEach(x=>x.classList.toggle("on",x===b));
    setTimeout(()=>{if(step<Q.length-1){step++;ask();}else results();},200);
  }
});
function favClick(b,repaint){
  toggleFav(decodeURIComponent(b.dataset.k));
  if(repaint)repaint();else b.setAttribute("aria-pressed",String(FAV.includes(decodeURIComponent(b.dataset.k))));
}
$("#results").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="again")start();
  else if(b.id==="share-btn")share();
  else if(b.dataset.more){R.shown[b.dataset.more]+=3;paint();}
  else if(b.classList.contains("fav"))favClick(b,R.F.fav?paint:null);
});
$("#results").addEventListener("change",e=>{
  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  R.F[f]=e.target.type==="checkbox"?e.target.checked:e.target.value;
  R.shown={e:3,d:3,n:3};paint();
});
$("#favs").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="back-home")show("home");
  else if(b.classList.contains("fav"))favClick(b,favs);
});
$("#favbtn").addEventListener("click",favs);
$("#share").addEventListener("click",e=>{
  if(e.target.id==="share"||e.target.id==="sh-x")$("#share").hidden=true;
  else if(e.target.id==="sh-send"&&shareCanvas)shareCanvas.toBlob(async b=>{
    const f=new File([b],"mi-perfil-fragancia-propia.png",{type:"image/png"});
    try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"Mi perfil olfativo"});}catch(err){}
  });
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#share").hidden=true;});

/* ---------- modo claro / oscuro ---------- */
const root=document.documentElement;
function paintTheme(){
  const d=(root.getAttribute("data-theme")||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))==="dark";
  const b=$("#themebtn");
  b.textContent=d?"☀\uFE0E":"☾\uFE0E";
  b.setAttribute("aria-label",d?"Cambiar a modo claro":"Cambiar a modo oscuro");
  return d;
}
$("#themebtn").addEventListener("click",()=>{
  const t=paintTheme()?"light":"dark";
  root.setAttribute("data-theme",t);
  try{localStorage.setItem("fp:theme",t);}catch(e){}
  paintTheme();
});
paintTheme();
syncFav();
</script>
